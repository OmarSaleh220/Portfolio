/* ================= accounting nature ================= */
function nature(type) { return (type === "asset" || type === "expense") ? "debit" : "credit"; }
function applyLine(byId, accountId, debit, credit) {
  const acc = byId[accountId];
  if (!acc) return;
  acc.balance += nature(acc.type) === "debit" ? (debit - credit) : (credit - debit);
}
function txRate(tx) { return tx.currency === "usd" ? (Number(tx.exchangeRate) || 1) : 1; }
function invoiceTotal(inv) { return (inv.items || []).reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0); }

function normalize(parsed) {
  const d = { ...emptyData(), ...parsed };
  if (!d.transactions) d.transactions = [];
  if (!d.users) d.users = [];
  if (!d.banks) d.banks = [];
  if (!d.products) d.products = [];
  if (!d.attendance) d.attendance = [];
  if (!d.payrollRuns) d.payrollRuns = [];
  d.salesInvoices = (d.salesInvoices || []).map(inv => inv.items ? inv : { ...inv, items: [{ id: uid(), desc: inv.desc || "", qty: inv.qty || 1, price: inv.price || 0 }] });
  d.purchaseInvoices = (d.purchaseInvoices || []).map(inv => inv.items ? inv : { ...inv, items: [{ id: uid(), desc: inv.desc || "", qty: inv.qty || 1, price: inv.price || 0 }] });
  return d;
}

/* stock = opening quantity + purchased qty - sold qty, per product */
function applyInventory(base) {
  const products = base.products.map(p => ({ ...p, stock: Number(p.openingStock) || 0 }));
  const byId = Object.fromEntries(products.map(p => [p.id, p]));
  base.purchaseInvoices.forEach(inv => (inv.items || []).forEach(it => { if (it.productId && byId[it.productId]) byId[it.productId].stock += Number(it.qty) || 0; }));
  base.salesInvoices.forEach(inv => (inv.items || []).forEach(it => { if (it.productId && byId[it.productId]) byId[it.productId].stock -= Number(it.qty) || 0; }));
  return products;
}

function applyLedger(base) {
  const accounts = base.accounts.map((a) => ({ ...a }));
  const customers = base.customers.map((c) => ({ ...c, balance: 0 }));
  const suppliers = base.suppliers.map((s) => ({ ...s, balance: 0 }));
  const byId = Object.fromEntries(accounts.map((a) => [a.id, a]));
  accounts.forEach((a) => { if (!a.editable) a.balance = 0; });

  base.salesInvoices.forEach((inv) => {
    const total = invoiceTotal(inv);
    const cust = customers.find((c) => c.id === inv.customerId);
    if (cust) cust.balance += inv.status === "مدفوعة" ? 0 : total;
    applyLine(byId, "a4-1", 0, total);
    if (inv.status === "مدفوعة") applyLine(byId, "a1-2", total, 0);
    else applyLine(byId, "a1-3", total, 0);
  });
  base.purchaseInvoices.forEach((inv) => {
    const total = invoiceTotal(inv);
    const sup = suppliers.find((s) => s.id === inv.supplierId);
    if (sup) sup.balance += inv.status === "مدفوعة" ? 0 : total;
    applyLine(byId, inv.accountId || "a5-5", total, 0);
    if (inv.status === "مدفوعة") applyLine(byId, "a1-2", 0, total);
    else applyLine(byId, "a2-1", 0, total);
  });
  (base.transactions || []).forEach((tx) => {
    const rate = txRate(tx);
    tx.lines.forEach((l) => applyLine(byId, l.accountId, (Number(l.debit) || 0) * rate, (Number(l.credit) || 0) * rate));
  });

  return {
    ...base, accounts,
    customers: customers.map((c, i) => ({ ...base.customers[i], balance: c.balance })),
    suppliers: suppliers.map((s, i) => ({ ...base.suppliers[i], balance: s.balance })),
  };
}

function buildJournal(base, lang) {
  const accName = (a) => lang === "en" ? (a.nameEn || a.name) : a.name;
  const rows = [];
  base.salesInvoices.forEach((inv) => {
    const total = invoiceTotal(inv);
    rows.push({
      id: "SI-" + inv.id, date: inv.date, memo: `${lang === "en" ? "Sales invoice" : "فاتورة بيع"} ${inv.number}`,
      lines: [
        { accountName: inv.status === "مدفوعة" ? (lang === "en" ? "Bank" : "البنك") : (lang === "en" ? "Accounts Receivable" : "عملاء (ذمم مدينة)"), debit: total, credit: 0 },
        { accountName: lang === "en" ? "Sales Revenue" : "إيراد المبيعات / الخدمات", debit: 0, credit: total },
      ],
    });
  });
  base.purchaseInvoices.forEach((inv) => {
    const total = invoiceTotal(inv);
    const acc = base.accounts.find(a => a.id === inv.accountId);
    const expName = acc ? accName(acc) : (lang === "en" ? "Misc Expenses" : "مصروفات متنوعة");
    rows.push({
      id: "PI-" + inv.id, date: inv.date, memo: `${lang === "en" ? "Purchase invoice" : "فاتورة شراء"} ${inv.number}`,
      lines: [
        { accountName: expName, debit: total, credit: 0 },
        { accountName: inv.status === "مدفوعة" ? (lang === "en" ? "Bank" : "البنك") : (lang === "en" ? "Accounts Payable" : "موردون (ذمم دائنة)"), debit: 0, credit: total },
      ],
    });
  });
  (base.transactions || []).forEach((tx) => {
    const rate = txRate(tx);
    const fx = tx.currency === "usd" ? ` ($${fmt(tx.lines.reduce((s, l) => s + (Number(l.debit) || 0), 0))} × ${rate})` : "";
    rows.push({
      id: "TX-" + tx.id, date: tx.date, memo: tx.memo + fx,
      lines: tx.lines.map(l => {
        const acc = base.accounts.find(a => a.id === l.accountId);
        return { accountName: acc ? accName(acc) : "—", debit: (Number(l.debit) || 0) * rate, credit: (Number(l.credit) || 0) * rate };
      }),
    });
  });
  return rows.sort((a, b) => b.date.localeCompare(a.date));
}

  const [f, setF] = useState({ fullName: "", username: "", password: "" });
  const valid = f.fullName && f.username && f.password.length >= 4;
  return (
    <AuthCard>
      <div className="flex items-center gap-2 mb-1 text-cyan-300">{Ic("lock", { size: 20 })}<span className="font-black text-lg text-slate-50">{t("auth_adminTitle")}</span></div>
      <p className="text-sm text-slate-400 mb-5">{t("auth_adminBody")}</p>
      <form className="space-y-4" onSubmit={e => { e.preventDefault(); if (valid) onCreate(f); }}>
        <Field label={t("users_fullName")}><input autoFocus className={inputCls} value={f.fullName} onChange={e => setF({ ...f, fullName: e.target.value })} /></Field>
        <Field label={t("users_username")}><input className={inputCls} value={f.username} onChange={e => setF({ ...f, username: e.target.value })} /></Field>
        <Field label={t("users_password")}><input type="password" className={inputCls} value={f.password} onChange={e => setF({ ...f, password: e.target.value })} /></Field>
        <PrimaryBtn type="submit" disabled={!valid} className="w-full justify-center">{t("btn_register")}</PrimaryBtn>
      </form>
    </AuthCard>
  );
}

function LoginScreen({ users, onLogin, onGoRegister }) {
  const t = useT();
  const [f, setF] = useState({ username: "", password: "" });
  const [err, setErr] = useState(false);
  function submit(e) {
    e.preventDefault();
    const u = users.find(u => u.username === f.username && u.password === f.password);
    if (u) onLogin(u); else setErr(true);
  }
  return (
    <AuthCard>
      <div className="flex items-center gap-2 mb-1 text-cyan-300">{Ic("lock", { size: 20 })}<span className="font-black text-lg text-slate-50">{t("auth_loginTitle")}</span></div>
      <p className="text-sm text-slate-400 mb-5">{t("auth_loginSubtitle")}</p>
      <form className="space-y-4" onSubmit={submit}>
        <Field label={t("users_username")}><input autoFocus className={inputCls} value={f.username} onChange={e => { setF({ ...f, username: e.target.value }); setErr(false); }} /></Field>
        <Field label={t("users_password")}><input type="password" className={inputCls} value={f.password} onChange={e => { setF({ ...f, password: e.target.value }); setErr(false); }} /></Field>
        {err && <div className="text-rose-300 text-sm">{t("auth_invalidLogin")}</div>}
        <PrimaryBtn type="submit" className="w-full justify-center">{t("btn_login")}</PrimaryBtn>
      </form>
      <div className="text-center text-sm text-slate-500 mt-4">{t("auth_noAccount")} <button onClick={onGoRegister} className="text-cyan-300 font-bold hover:underline">{t("auth_registerLink")}</button></div>
    </AuthCard>
  );
}

function RegisterScreen({ users, onRegister, onGoLogin }) {
  const t = useT();
  const [f, setF] = useState({ fullName: "", username: "", password: "" });
  const [err, setErr] = useState(false);
  const valid = f.fullName && f.username && f.password.length >= 4;
  function submit(e) {
    e.preventDefault();
    if (users.some(u => u.username === f.username)) { setErr(true); return; }
    if (valid) onRegister(f);
  }
  return (
    <AuthCard>
      <div className="flex items-center gap-2 mb-1 text-cyan-300">{Ic("user", { size: 20 })}<span className="font-black text-lg text-slate-50">{t("auth_registerTitle")}</span></div>
      <form className="space-y-4 mt-5" onSubmit={submit}>
        <Field label={t("users_fullName")}><input autoFocus className={inputCls} value={f.fullName} onChange={e => setF({ ...f, fullName: e.target.value })} /></Field>
        <Field label={t("users_username")}><input className={inputCls} value={f.username} onChange={e => { setF({ ...f, username: e.target.value }); setErr(false); }} /></Field>
        <Field label={t("users_password")}><input type="password" className={inputCls} value={f.password} onChange={e => setF({ ...f, password: e.target.value })} /></Field>
        {err && <div className="text-rose-300 text-sm">{t("auth_usernameTaken")}</div>}
        <PrimaryBtn type="submit" disabled={!valid} className="w-full justify-center">{t("btn_register")}</PrimaryBtn>
      </form>
      <div className="text-center text-sm text-slate-500 mt-4">{t("auth_haveAccount")} <button onClick={onGoLogin} className="text-cyan-300 font-bold hover:underline">{t("auth_loginLink")}</button></div>
    </AuthCard>
  );
}

/* ================= root app ================= */
function Root() {
  const [lang, setLang] = useState(() => localStorage.getItem("erp-lang") || "ar");
  useEffect(() => { localStorage.setItem("erp-lang", lang); }, [lang]);
  const t = (key) => (STRINGS[key] ? STRINGS[key][lang === "en" ? 1 : 0] : key);
  return (
    <LangContext.Provider value={{ lang, setLang, t }}>
      <div dir={lang === "ar" ? "rtl" : "ltr"} className={lang === "ar" ? "font-ar" : "font-en"}>
        <App />
      </div>
    </LangContext.Provider>
  );
}

function LangToggle() {
  const { lang, setLang } = useLang();
  return (
    <button onClick={() => setLang(lang === "ar" ? "en" : "ar")} className="no-print inline-flex items-center gap-1.5 rounded-lg bg-white/5 text-slate-300 text-xs font-bold px-3 py-1.5 hover:bg-white/10 transition-colors ring-1 ring-white/10">
      {Ic("globe", { size: 13 })} {lang === "ar" ? "English" : "العربية"}
    </button>
  );
}

function App() {
  const t = useT();
  const [raw, setRaw] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState("");
  const [confirmReset, setConfirmReset] = useState(false);
  const [syncState, setSyncState] = useState("connecting");
  const [currentUser, setCurrentUser] = useState(null);
  const [authScreen, setAuthScreen] = useState("login"); // login | register
  const saveTimer = useRef(null);
  const skipNextSave = useRef(true);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch("/api/data");
        if (!res.ok) throw new Error("bad response");
        const parsed = normalize(await res.json());
        skipNextSave.current = true;
        setRaw(parsed);
        setSyncState("synced");
      } catch (err) {
        setSyncState("offline");
        setRaw(emptyData());
      }
    })();
  }, []);

  useEffect(() => {
    if (!raw) return;
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    setSyncState("saving");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        const res = await fetch("/api/data", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(raw) });
        if (!res.ok) throw new Error("save failed");
        setSyncState("synced");
      } catch { setSyncState("offline"); }
    }, 500);
  }, [raw]);

  // session restore
  useEffect(() => {
    if (!raw) return;
    try {
      const sess = JSON.parse(localStorage.getItem("erp-session") || "null");
      if (sess) {
        const u = raw.users.find(u => u.username === sess.username);
        if (u) setCurrentUser(u);
      }
    } catch {}
  }, [raw?.company]);

  const data = useMemo(() => (raw ? applyLedger(raw) : null), [raw]);
  const products = useMemo(() => (raw ? applyInventory(raw) : []), [raw]);
  const { lang } = useLang();
  const journal = useMemo(() => (raw ? buildJournal({ ...raw, accounts: data.accounts }, lang) : []), [raw, data, lang]);
  function flash(msg) { setToast(msg); setTimeout(() => setToast(""), 2200); }

  if (!raw || !data) {
    return <div className="min-h-screen bg-[#0B1220] flex items-center justify-center text-slate-500">…</div>;
  }

  if (!raw.company) {
    return <div className="min-h-screen bg-[#0B1220]"><CompanySetupModal onSave={(company) => { setRaw(r => ({ ...r, company })); }} /></div>;
  }

  function loginSession(u) { setCurrentUser(u); localStorage.setItem("erp-session", JSON.stringify({ username: u.username })); }
  function logout() { setCurrentUser(null); localStorage.removeItem("erp-session"); }

  if (raw.users.length === 0) {
    return (
      <div className="min-h-screen bg-[#0B1220]">
        <FirstAdminScreen onCreate={(f) => {
          const u = { id: uid(), username: f.username, password: f.password, fullName: f.fullName, role: "admin" };
          setRaw(r => ({ ...r, users: [u] }));
          loginSession(u);
        }} />
      </div>
    );
  }

  if (!currentUser) {
    return (
      <div className="min-h-screen bg-[#0B1220]">
        {authScreen === "login"
          ? <LoginScreen users={raw.users} onLogin={loginSession} onGoRegister={() => setAuthScreen("register")} />
          : <RegisterScreen users={raw.users} onGoLogin={() => setAuthScreen("login")} onRegister={(f) => {
              const u = { id: uid(), username: f.username, password: f.password, fullName: f.fullName, role: "user" };
              setRaw(r => ({ ...r, users: [...r.users, u] }));
              loginSession(u);
            }} />}
      </div>
    );
  }

  const totals = {
    salesTotal: data.salesInvoices.reduce((s, i) => s + invoiceTotal(i), 0),
    purchasesTotal: data.purchaseInvoices.reduce((s, i) => s + invoiceTotal(i), 0),
    cash: (data.accounts.find(a => a.id === "a1-1")?.balance || 0) + (data.accounts.find(a => a.id === "a1-2")?.balance || 0),
    receivable: data.accounts.find(a => a.id === "a1-3")?.balance || 0,
    payable: data.accounts.find(a => a.id === "a2-1")?.balance || 0,
  };
  const net = totals.salesTotal - totals.purchasesTotal;
  const currency = raw.company?.currency || "ج.م";

  function addSale(form) {
    setRaw(r => ({ ...r, salesInvoices: [{ id: uid(), number: `SI-${1000 + r.salesInvoices.length + 1}`, ...form }, ...r.salesInvoices] }));
    flash("✓");
  }
  function addPurchase(form) {
    setRaw(r => ({ ...r, purchaseInvoices: [{ id: uid(), number: `PI-${2000 + r.purchaseInvoices.length + 1}`, ...form }, ...r.purchaseInvoices] }));
    flash("✓");
  }
  function addPerson(kind, form) { setRaw(r => ({ ...r, [kind]: [{ id: uid(), balance: 0, ...form }, ...r[kind]] })); flash("✓"); }
  function addEmployee(form) { setRaw(r => ({ ...r, employees: [{ id: uid(), ...form, salary: Number(form.salary) }, ...r.employees] })); flash("✓"); }
  function addAttendance(form) { setRaw(r => ({ ...r, attendance: [{ id: uid(), ...form }, ...(r.attendance || [])] })); flash("✓"); }
  function removeAttendance(id) { setRaw(r => ({ ...r, attendance: (r.attendance || []).filter(x => x.id !== id) })); }
  function addPayrollRun(run) { setRaw(r => ({ ...r, payrollRuns: [{ id: uid(), status: "غير مدفوعة", ...run }, ...(r.payrollRuns || [])] })); flash("✓"); }
  function markPayrollPaid(run) {
    setRaw(r => ({
      ...r,
      payrollRuns: (r.payrollRuns || []).map(p => p.id === run.id ? { ...p, status: "مدفوعة" } : p),
      transactions: [{ id: uid(), date: today(), memo: `${run.month} صرف رواتب`, lines: [{ accountId: "a5-1", debit: run.total, credit: 0 }, { accountId: "a1-2", debit: 0, credit: run.total }] }, ...(r.transactions || [])],
    }));
    flash("✓");
  }
  function addBank(form) { setRaw(r => ({ ...r, banks: [{ id: uid(), balance: 0, ...form }, ...r.banks] })); flash("✓"); }
  function addProduct(form) { setRaw(r => ({ ...r, products: [{ id: uid(), ...form }, ...r.products] })); flash("✓"); }
  function setProductStock(id, value) { setRaw(r => ({ ...r, products: r.products.map(p => p.id === id ? { ...p, openingStock: Number(value) || 0 } : p) })); }
  function removeItem(kind, id) { setRaw(r => ({ ...r, [kind]: r[kind].filter(x => x.id !== id) })); }
  function toggleStatus(kind, id) { setRaw(r => ({ ...r, [kind]: r[kind].map(x => x.id === id ? { ...x, status: x.status === "مدفوعة" ? "غير مدفوعة" : "مدفوعة" } : x) })); }
  function setOpeningBalance(id, value) { setRaw(r => ({ ...r, accounts: r.accounts.map(a => a.id === id ? { ...a, balance: Number(value) || 0 } : a) })); }
  function setBankBalance(id, value) { setRaw(r => ({ ...r, banks: r.banks.map(b => b.id === id ? { ...b, balance: Number(value) || 0 } : b) })); }
  function saveCompany(company) { setRaw(r => ({ ...r, company })); flash("✓"); }
  function addTransaction(tx) { setRaw(r => ({ ...r, transactions: [{ id: uid(), ...tx }, ...(r.transactions || [])] })); flash("✓"); }
  function removeTransaction(id) { setRaw(r => ({ ...r, transactions: (r.transactions || []).filter(x => x.id !== id) })); }
  function addUser(u) { setRaw(r => ({ ...r, users: [...r.users, { id: uid(), ...u }] })); flash("✓"); }
  function removeUser(id) { setRaw(r => ({ ...r, users: r.users.filter(u => u.id !== id) })); }
  function resetAll() { const fresh = emptyData(); fresh.company = raw.company; fresh.users = raw.users; setRaw(fresh); setConfirmReset(false); flash("✓"); }

  const initials = (raw.company?.name || "؟").trim().charAt(0);
  const postableAccounts = data.accounts.filter(a => a.type !== "root");
  const isAdmin = currentUser.role === "admin";
  const visibleNav = NAV.filter(n => !n.adminOnly || isAdmin);

  return (
    <div className="min-h-screen bg-[#0B1220] text-slate-200">
      <div className="flex">
        <aside className="no-print hidden md:flex w-64 shrink-0 flex-col border-l border-white/5 rtl:border-l rtl:border-r-0 bg-[#0D1524] min-h-screen sticky top-0">
          <div className="px-5 py-6 border-b border-white/5">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-cyan-600 flex items-center justify-center font-black text-[#07101E] text-lg">{initials}</div>
              <div className="min-w-0">
                <div className="font-black text-slate-50 leading-tight truncate">{raw.company.name}</div>
                <div className="text-[11px] text-slate-500 truncate">{raw.company.activity}</div>
              </div>
            </div>
          </div>
          <nav className="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
            {visibleNav.map(n => {
              const active = tab === n.key;
              return (
                <button key={n.key} onClick={() => setTab(n.key)} className={`w-full flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-bold transition-colors ${active ? "bg-cyan-400/10 text-cyan-300 ring-1 ring-cyan-400/30" : "text-slate-400 hover:bg-white/5 hover:text-slate-200"}`}>
                  {Ic(n.icon, { size: 17 })} {t(n.label)}
                </button>
              );
            })}
          </nav>
          <div className="px-5 py-4 border-t border-white/5 space-y-3">
            <LangToggle />
            <div className="flex items-center justify-between">
              <div className="text-xs text-slate-400 truncate">{currentUser.fullName}</div>
              <button onClick={logout} className="text-slate-500 hover:text-rose-300" title={t("btn_logout")}>{Ic("logout", { size: 15 })}</button>
            </div>
          </div>
        </aside>

        <div className="no-print md:hidden fixed bottom-0 inset-x-0 z-40 bg-[#0D1524] border-t border-white/10 flex overflow-x-auto">
          {visibleNav.map(n => {
            const active = tab === n.key;
            return (
              <button key={n.key} onClick={() => setTab(n.key)} className={`flex-1 min-w-[76px] flex flex-col items-center gap-1 py-2.5 text-[10px] font-bold ${active ? "text-cyan-300" : "text-slate-500"}`}>
                {Ic(n.icon, { size: 17 })} {t(n.label)}
              </button>
            );
          })}
        </div>

        <main className="flex-1 min-w-0 pb-24 md:pb-8 print-area">
          <div className="no-print border-b border-white/5 bg-[#0D1524]/60 px-5 md:px-8 py-3 flex flex-wrap items-center gap-x-8 gap-y-1 text-[12px] tabular">
            <StripStat label={t("strip_cash")} value={totals.cash} color="text-cyan-300" currency={currency} />
            <StripStat label={t("strip_receivable")} value={totals.receivable} color="text-amber-300" currency={currency} />
            <StripStat label={t("strip_payable")} value={totals.payable} color="text-rose-300" currency={currency} />
            <StripStat label={t("strip_net")} value={net} color={net >= 0 ? "text-emerald-300" : "text-rose-300"} currency={currency} />
            <SyncBadge state={syncState} />
          </div>

          <div className="px-5 md:px-8 py-6">
            {tab === "dashboard" && <Dashboard data={data} totals={totals} currency={currency} company={raw.company} products={products} />}
            {tab === "accounts" && <AccountsTree accounts={data.accounts} currency={currency} onEdit={setOpeningBalance} isAdmin={isAdmin} />}
            {tab === "transactions" && <TransactionsPage transactions={raw.transactions || []} accounts={postableAccounts} currency={currency} onAdd={() => setModal({ type: "transaction" })} onDelete={removeTransaction} />}
            {tab === "sales" && <InvoiceTable kind="sale" rows={data.salesInvoices} who={data.customers} whoKey="customerId" currency={currency} onAdd={() => setModal({ type: "sale" })} onDelete={id => removeItem("salesInvoices", id)} onToggle={id => toggleStatus("salesInvoices", id)} onPrint={(inv) => setModal({ type: "printInvoice", kind: "sale", invoice: inv })} banks={raw.banks} />}
            {tab === "purchases" && <InvoiceTable kind="purchase" rows={data.purchaseInvoices} who={data.suppliers} whoKey="supplierId" currency={currency} onAdd={() => setModal({ type: "purchase" })} onDelete={id => removeItem("purchaseInvoices", id)} onToggle={id => toggleStatus("purchaseInvoices", id)} onPrint={(inv) => setModal({ type: "printInvoice", kind: "purchase", invoice: inv })} banks={raw.banks} accounts={data.accounts} />}
            {tab === "inventory" && <InventoryPage products={products} currency={currency} isAdmin={isAdmin} onAdd={() => setModal({ type: "product" })} onDelete={id => removeItem("products", id)} onEdit={setProductStock} />}
            {tab === "customers" && <PeopleTable kind="customer" rows={data.customers} currency={currency} onAdd={() => setModal({ type: "customer" })} onDelete={id => removeItem("customers", id)} />}
            {tab === "suppliers" && <PeopleTable kind="supplier" rows={data.suppliers} currency={currency} onAdd={() => setModal({ type: "supplier" })} onDelete={id => removeItem("suppliers", id)} />}
            {tab === "employees" && <EmployeesTable rows={data.employees} currency={currency} onAdd={() => setModal({ type: "employee" })} onDelete={id => removeItem("employees", id)} />}
            {tab === "attendance" && <AttendancePage records={raw.attendance || []} employees={data.employees} onAdd={() => setModal({ type: "attendance" })} onDelete={removeAttendance} />}
            {tab === "payroll" && <PayrollPage runs={raw.payrollRuns || []} employees={data.employees} currency={currency} isAdmin={isAdmin} onAdd={() => setModal({ type: "payroll" })} onMarkPaid={markPayrollPaid} />}
            {tab === "banks" && <BanksPage banks={raw.banks} currency={currency} onAdd={() => setModal({ type: "bank" })} onDelete={id => removeItem("banks", id)} onEdit={setBankBalance} isAdmin={isAdmin} />}
            {tab === "reports" && <ReportsPage data={data} journal={journal} currency={currency} company={raw.company} />}
            {tab === "users" && <UsersPage users={raw.users} currentUser={currentUser} onAdd={() => setModal({ type: "user" })} onDelete={removeUser} />}
            {tab === "settings" && <SettingsPanel company={raw.company} onSave={saveCompany} onResetClick={() => setConfirmReset(true)} />}
          </div>
        </main>
      </div>

      {toast && <div className="no-print fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 bg-emerald-400 text-[#07101E] font-bold text-sm px-4 py-2 rounded-full shadow-xl">{toast}</div>}

      {modal?.type === "sale" && (data.customers.length === 0
        ? <NeedPersonFirst kind="customer" onClose={() => setModal(null)} onGo={() => { setModal(null); setTab("customers"); }} />
        : <InvoiceForm kind="sale" partners={data.customers} banks={raw.banks} products={products} onClose={() => setModal(null)} onSubmit={f => { addSale(f); setModal(null); }} />)}
      {modal?.type === "purchase" && (data.suppliers.length === 0
        ? <NeedPersonFirst kind="supplier" onClose={() => setModal(null)} onGo={() => { setModal(null); setTab("suppliers"); }} />
        : <InvoiceForm kind="purchase" partners={data.suppliers} banks={raw.banks} products={products} accounts={data.accounts.filter(a => a.type === "expense")} onClose={() => setModal(null)} onSubmit={f => { addPurchase(f); setModal(null); }} />)}
      {modal?.type === "customer" && <PersonForm kind="customer" onClose={() => setModal(null)} onSubmit={f => { addPerson("customers", f); setModal(null); }} />}
      {modal?.type === "supplier" && <PersonForm kind="supplier" onClose={() => setModal(null)} onSubmit={f => { addPerson("suppliers", f); setModal(null); }} />}
      {modal?.type === "employee" && <EmployeeForm employees={data.employees} onClose={() => setModal(null)} onSubmit={f => { addEmployee(f); setModal(null); }} />}
      {modal?.type === "attendance" && <AttendanceForm employees={data.employees} onClose={() => setModal(null)} onSubmit={f => { addAttendance(f); setModal(null); }} />}
      {modal?.type === "payroll" && <PayrollForm employees={data.employees} currency={currency} onClose={() => setModal(null)} onSubmit={f => { addPayrollRun(f); setModal(null); }} />}
      {modal?.type === "bank" && <BankForm onClose={() => setModal(null)} onSubmit={f => { addBank(f); setModal(null); }} />}
      {modal?.type === "product" && <ProductForm onClose={() => setModal(null)} onSubmit={f => { addProduct(f); setModal(null); }} />}
      {modal?.type === "transaction" && <TransactionForm accounts={postableAccounts} currency={currency} onClose={() => setModal(null)} onSubmit={tx => { addTransaction(tx); setModal(null); }} />}
      {modal?.type === "user" && <UserForm users={raw.users} onClose={() => setModal(null)} onSubmit={u => { addUser(u); setModal(null); }} />}
      {modal?.type === "printInvoice" && (
        <InvoicePrintModal
          invoice={modal.invoice} kind={modal.kind} company={raw.company} currency={currency}
          partner={(modal.kind === "sale" ? data.customers : data.suppliers).find(p => p.id === (modal.kind === "sale" ? modal.invoice.customerId : modal.invoice.supplierId))}
          bank={raw.banks.find(b => b.id === modal.invoice.bankId)}
          onClose={() => setModal(null)}
        />
      )}

      {confirmReset && (
        <Modal title={t("reset_title")} onClose={() => setConfirmReset(false)}>
          <div className="flex items-start gap-3 text-sm text-slate-300">
            <span className="text-rose-300 mt-0.5">{Ic("alert", { size: 20 })}</span>
            <p>{t("reset_body")}</p>
          </div>
          <div className="flex justify-end gap-2 pt-5"><GhostBtn onClick={() => setConfirmReset(false)}>{t("btn_cancel")}</GhostBtn><DangerBtn onClick={resetAll}>{t("reset_confirm")}</DangerBtn></div>
        </Modal>
      )}
    </div>
  );
}

function NeedPersonFirst({ kind, onClose, onGo }) {
  const t = useT();
  return (
    <Modal title={kind === "customer" ? t("inv_needPersonTitleCustomer") : t("inv_needPersonTitleSupplier")} onClose={onClose}>
      <p className="text-sm text-slate-400 mb-4">{kind === "customer" ? t("inv_needPersonBodyCustomer") : t("inv_needPersonBodySupplier")}</p>
      <div className="flex justify-end"><PrimaryBtn onClick={onGo}>{kind === "customer" ? t("inv_goToCustomers") : t("inv_goToSuppliers")}</PrimaryBtn></div>
    </Modal>
  );
}

function Dashboard({ data, totals, currency, company, products }) {
  const t = useT();
  const months = useMemo(() => {
    const map = {};
    data.salesInvoices.forEach(i => { const m = i.date.slice(0, 7); map[m] = map[m] || { month: m, sales: 0, purchases: 0 }; map[m].sales += invoiceTotal(i); });
    data.purchaseInvoices.forEach(i => { const m = i.date.slice(0, 7); map[m] = map[m] || { month: m, sales: 0, purchases: 0 }; map[m].purchases += invoiceTotal(i); });
    return Object.values(map).sort((a, b) => a.month.localeCompare(b.month));
  }, [data]);

  const topCustomers = useMemo(() => {
    const byC = {};
    data.salesInvoices.forEach(i => { byC[i.customerId] = (byC[i.customerId] || 0) + invoiceTotal(i); });
    return Object.entries(byC).map(([id, total]) => ({ name: data.customers.find(c => c.id === id)?.name || "—", total })).sort((a, b) => b.total - a.total).slice(0, 5);
  }, [data]);
  const lowStock = useMemo(() => (products || []).filter(p => p.stock <= 5), [products]);

  const cards = [
    { label: t("dash_totalSales"), value: `${fmt(totals.salesTotal)} ${currency}`, icon: "up", color: "text-cyan-300" },
    { label: t("dash_totalPurchases"), value: `${fmt(totals.purchasesTotal)} ${currency}`, icon: "down", color: "text-rose-300" },
    { label: t("dash_cash"), value: `${fmt(totals.cash)} ${currency}`, icon: "wallet", color: "text-emerald-300" },
    { label: t("dash_employeesCount"), value: `${data.employees.length}`, icon: "briefcase", color: "text-amber-300" },
  ];
  const isEmpty = data.salesInvoices.length === 0 && data.purchaseInvoices.length === 0 && data.customers.length === 0;

  return (
    <div className="space-y-8">
      <div>
        <h1 className="text-2xl font-black text-slate-50">{t("dash_title")}</h1>
        <p className="text-slate-500 text-sm mt-1">{t("dash_subtitle")} {company?.name}</p>
      </div>

      {isEmpty && (
        <div className="rounded-2xl border border-cyan-400/20 bg-cyan-400/5 p-5 text-sm text-slate-300">
          <div className="font-bold text-cyan-300 mb-1">{t("dash_emptyTitle")}</div>
          {t("dash_emptyBody")}
        </div>
      )}

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {cards.map(c => (
          <div key={c.label} className="rounded-2xl border border-white/5 bg-[#111B2E] p-5">
            <span className={c.color}>{Ic(c.icon, { size: 20 })}</span>
            <div className="mt-3 text-2xl font-black tabular text-slate-50">{c.value}</div>
            <div className="text-xs text-slate-400 mt-1">{c.label}</div>
          </div>
        ))}
      </div>
      <div className="rounded-2xl border border-white/5 bg-[#111B2E] p-5">
        <div className="flex items-center justify-between mb-2">
          <h2 className="font-bold text-slate-200">{t("dash_chartTitle")}</h2>
          <div className="flex items-center gap-4 text-xs text-slate-400">
            <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-cyan-400 inline-block"></span>{t("dash_sales")}</span>
            <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-rose-400 inline-block"></span>{t("dash_purchases")}</span>
          </div>
        </div>
        <MiniBarChart rows={months} />
      </div>

      <div className="grid md:grid-cols-2 gap-4">
        <div className="rounded-2xl border border-white/5 bg-[#111B2E] p-5">
          <h2 className="font-bold text-slate-200 mb-3">{t("dash_topCustomers")}</h2>
          {topCustomers.length === 0 ? <div className="text-slate-600 text-sm">{t("dash_noData")}</div> : (
            <div className="space-y-2">
              {topCustomers.map(c => (
                <div key={c.name} className="flex items-center justify-between text-sm border-b border-white/5 pb-2 last:border-0">
                  <span className="text-slate-300">{c.name}</span>

        <div className="rounded-2xl border border-white/5 bg-[#111B2E] p-5">
          <h2 className="font-bold text-slate-200 mb-3">{t("dash_lowStock")}</h2>
          {lowStock.length === 0 ? <div className="text-slate-600 text-sm">{t("dash_noData")}</div> : (
            <div className="space-y-2">

const TYPE_LABEL = { asset: ["أصول", "Asset"], liability: ["خصوم", "Liability"], equity: ["حقوق ملكية", "Equity"], revenue: ["إيرادات", "Revenue"], expense: ["مصروفات", "Expense"] };
const TYPE_COLOR = { asset: "text-cyan-300", liability: "text-rose-300", equity: "text-violet-300", revenue: "text-emerald-300", expense: "text-amber-300" };

function EditableBalance({ value, onSave, currency }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  useEffect(() => setVal(value), [value]);
  if (!editing) {
    return (
      <button onClick={() => setEditing(true)} className="no-print flex items-center gap-1.5 tabular font-bold text-slate-200 hover:text-cyan-300 group">
        {fmt(value)} {currency}
        <span className="opacity-0 group-hover:opacity-100 text-slate-500">{Ic("pencil", { size: 12 })}</span>
      </button>
    );
  }
  return (
    <form className="flex items-center gap-1.5" onSubmit={(e) => { e.preventDefault(); onSave(val); setEditing(false); }}>
      <input autoFocus type="number" className="w-28 bg-[#0F1729] border border-cyan-400/50 rounded-md px-2 py-1 text-sm text-slate-100 tabular outline-none" value={val} onChange={e => setVal(e.target.value)} onBlur={() => { onSave(val); setEditing(false); }} />
      <span className="text-xs text-slate-500">{currency}</span>
    </form>
  );
}

function TransactionForm({ accounts, currency, onClose, onSubmit }) {
  const t = useT(); const { lang } = useLang();
  const accName = (a) => lang === "en" ? (a.nameEn || a.name) : a.name;
  const [memo, setMemo] = useState("");
  const [date, setDate] = useState(today());
  const [txCurrency, setTxCurrency] = useState("local");
  const [exchangeRate, setExchangeRate] = useState("");
  const [lines, setLines] = useState([{ accountId: accounts[0]?.id || "", debit: "", credit: "" }, { accountId: accounts[1]?.id || "", debit: "", credit: "" }]);
  const debitTotal = lines.reduce((s, l) => s + (Number(l.debit) || 0), 0);
  const creditTotal = lines.reduce((s, l) => s + (Number(l.credit) || 0), 0);
  const balanced = debitTotal > 0 && debitTotal === creditTotal;
  const isUsd = txCurrency === "usd";
  const rateValid = !isUsd || Number(exchangeRate) > 0;
  const valid = memo.trim() && balanced && rateValid;
  function updateLine(i, patch) { setLines(ls => ls.map((l, idx) => idx === i ? { ...l, ...patch } : l)); }
  function addLine() { setLines(ls => [...ls, { accountId: accounts[0]?.id || "", debit: "", credit: "" }]); }
  function removeLine(i) { setLines(ls => ls.filter((_, idx) => idx !== i)); }
  return (
    <Modal title={t("tx_new_title")} onClose={onClose} wide>
      <form className="space-y-4" onSubmit={e => { e.preventDefault(); if (valid) onSubmit({ date, memo, currency: txCurrency, exchangeRate: isUsd ? Number(exchangeRate) : undefined, lines: lines.filter(l => (Number(l.debit) || Number(l.credit))) }); }}>
        <div className="grid grid-cols-2 gap-3">
          <Field label={t("tx_memo")}><input className={inputCls} value={memo} onChange={e => setMemo(e.target.value)} /></Field>
          <Field label={t("common_date")}><input type="date" className={inputCls} value={date} onChange={e => setDate(e.target.value)} /></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label={t("tx_currency")}>
            <select className={inputCls} value={txCurrency} onChange={e => setTxCurrency(e.target.value)}>
              <option value="local">{t("tx_currency_local")}</option>
              <option value="usd">{t("tx_currency_usd")}</option>
            </select>
          </Field>
          {isUsd && (
            <Field label={t("tx_exchangeRate")}>
              <input type="number" min={0} step="0.01" className={inputCls} value={exchangeRate} onChange={e => setExchangeRate(e.target.value)} placeholder="e.g. 49.50" />
            </Field>
          )}
        </div>
        <div className="space-y-2">
          <div className="text-sm text-slate-400">{t("tx_lines")} {isUsd && `(${t("tx_currency_usd")})`}</div>
          {lines.map((l, i) => (
            <div key={i} className="grid grid-cols-[1fr_110px_110px_32px] gap-2 items-center">
              <select className={inputCls} value={l.accountId} onChange={e => updateLine(i, { accountId: e.target.value })}>
                {accounts.map(a => <option key={a.id} value={a.id}>{a.code} · {accName(a)}</option>)}
              </select>
              <input type="number" min={0} placeholder={t("tx_debit")} className={inputCls} value={l.debit} onChange={e => updateLine(i, { debit: e.target.value, credit: e.target.value ? "" : l.credit })} />
              <input type="number" min={0} placeholder={t("tx_credit")} className={inputCls} value={l.credit} onChange={e => updateLine(i, { credit: e.target.value, debit: e.target.value ? "" : l.debit })} />
              <button type="button" onClick={() => removeLine(i)} className="text-slate-600 hover:text-rose-400 justify-self-center">{Ic("trash", { size: 15 })}</button>
            </div>
          ))}
          <button type="button" onClick={addLine} className="text-cyan-300 text-sm font-bold flex items-center gap-1 pt-1">{Ic("plus", { size: 14 })} {t("tx_addLine")}</button>
        </div>
        <div className={`rounded-lg px-3 py-2 text-sm font-bold flex justify-between flex-wrap gap-1 ${balanced ? "bg-emerald-400/10 text-emerald-300" : "bg-rose-400/10 text-rose-300"}`}>
          <span>{t("tx_debit")}: {fmt(debitTotal)}</span><span>{t("tx_credit")}: {fmt(creditTotal)}</span><span>{balanced ? t("tx_balanced") : t("tx_unbalanced")}</span>
        </div>
        {isUsd && rateValid && balanced && (
          <div className="rounded-lg px-3 py-2 text-sm font-bold bg-cyan-400/10 text-cyan-300 flex justify-between">
            <span>{t("tx_convertedTotal")}</span><span className="tabular">{fmt(debitTotal * Number(exchangeRate))} {currency}</span>
          </div>
        )}
        <div className="flex justify-end gap-2 pt-2"><PrimaryBtn type="submit" disabled={!valid}>{t("btn_save")}</PrimaryBtn></div>
      </form>
    </Modal>
  );
}

function ItemsEditor({ items, setItems, currency, products, priceField }) {
  const t = useT();
  function update(i, patch) { setItems(its => its.map((it, idx) => idx === i ? { ...it, ...patch } : it)); }
  function add() { setItems(its => [...its, { id: uid(), desc: "", qty: 1, price: "" }]); }
  function remove(i) { setItems(its => its.filter((_, idx) => idx !== i)); }
  function pickProduct(i, productId) {
    if (!productId) { update(i, { productId: undefined }); return; }
    const p = products.find(p => p.id === productId);
    if (p) update(i, { productId: p.id, desc: p.name, price: p[priceField] || 0 });
  }
  const total = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  const hasProducts = products && products.length > 0;
  return (
    <div className="space-y-2">
      <div className="text-sm text-slate-400">{t("inv_items")}</div>
      <div className="grid grid-cols-[1fr_70px_100px_90px_32px] gap-2 text-xs text-slate-500 px-1">
        <span>{t("common_description")}</span><span>{t("common_qty")}</span><span>{t("common_price")}</span><span>{t("common_total")}</span><span></span>
      </div>
      {items.map((it, i) => (
        <div key={it.id} className="space-y-1">
          {hasProducts && (
            <select className={inputCls + " text-xs"} value={it.productId || ""} onChange={e => pickProduct(i, e.target.value)}>
              <option value="">— {t("stock_manualItem")} —</option>
              {products.map(p => <option key={p.id} value={p.id}>{p.sku ? p.sku + " · " : ""}{p.name} ({fmt(p.stock)} {p.unit})</option>)}
            </select>
          )}
          <div className="grid grid-cols-[1fr_70px_100px_90px_32px] gap-2 items-center">
            <input className={inputCls} value={it.desc} onChange={e => update(i, { desc: e.target.value })} placeholder={t("common_description")} disabled={!!it.productId} />
            <input type="number" min={0} className={inputCls} value={it.qty} onChange={e => update(i, { qty: e.target.value })} />
            <input type="number" min={0} className={inputCls} value={it.price} onChange={e => update(i, { price: e.target.value })} />
            <div className="text-sm tabular text-slate-300 text-center">{fmt((Number(it.qty) || 0) * (Number(it.price) || 0))}</div>
            <button type="button" onClick={() => remove(i)} className="text-slate-600 hover:text-rose-400 justify-self-center">{Ic("trash", { size: 15 })}</button>
          </div>
        </div>
      ))}
      <button type="button" onClick={add} className="text-cyan-300 text-sm font-bold flex items-center gap-1 pt-1">{Ic("plus", { size: 14 })} {t("inv_addItem")}</button>
      <div className="flex justify-between items-center rounded-lg bg-white/5 px-3 py-2 mt-2 font-bold">
        <span className="text-sm text-slate-300">{t("inv_grandTotal")}</span>
        <span className="tabular text-cyan-300">{fmt(total)} {currency}</span>
      </div>
    </div>
  );
}

function InvoiceForm({ kind, partners, banks, products, accounts, onClose, onSubmit }) {
  const t = useT();
  const isSale = kind === "sale";
  const [partnerId, setPartnerId] = useState(partners[0]?.id || "");
  const [date, setDate] = useState(today());
  const [status, setStatus] = useState("غير مدفوعة");
  const [bankId, setBankId] = useState(banks?.[0]?.id || "");
  const [accountId, setAccountId] = useState(accounts?.[0]?.id || "");
  const [items, setItems] = useState([{ id: uid(), desc: "", qty: 1, price: "" }]);
  const total = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  const valid = partnerId && total > 0 && items.every(it => it.desc.trim());

  function submit(e) {
    e.preventDefault();
    if (!valid) return;
    const cleanItems = items.map(it => ({ id: it.id, productId: it.productId, desc: it.desc, qty: Number(it.qty) || 0, price: Number(it.price) || 0 }));
    const base = { date, status, items: cleanItems };
    if (isSale) onSubmit({ ...base, customerId: partnerId, bankId: status === "مدفوعة" ? bankId : undefined });
    else onSubmit({ ...base, supplierId: partnerId, accountId, bankId: status === "مدفوعة" ? bankId : undefined });
  }

  return (
    <Modal title={isSale ? t("inv_new_sale_title") : t("inv_new_purchase_title")} onClose={onClose} wide>

function PayrollForm({ employees, currency, onClose, onSubmit }) {
  const t = useT();
  const [month, setMonth] = useState(today().slice(0, 7));
  const [items, setItems] = useState(employees.map(e => ({ employeeId: e.id, base: e.salary, bonus: 0, deduction: 0 })));
  function update(i, patch) { setItems(its => its.map((it, idx) => idx === i ? { ...it, ...patch } : it)); }
  const total = items.reduce((s, it) => s + (Number(it.base) || 0) + (Number(it.bonus) || 0) - (Number(it.deduction) || 0), 0);
  const valid = items.length > 0 && month;

  function submit(e) {
    e.preventDefault();
    if (!valid) return;
    const cleanItems = items.map(it => ({ ...it, base: Number(it.base) || 0, bonus: Number(it.bonus) || 0, deduction: Number(it.deduction) || 0, net: (Number(it.base) || 0) + (Number(it.bonus) || 0) - (Number(it.deduction) || 0) }));
    onSubmit({ month, date: today(), items: cleanItems, total: cleanItems.reduce((s, it) => s + it.net, 0) });
  }

  if (employees.length === 0) {
    return <Modal title={t("pay_newTitle")} onClose={onClose}><p className="text-sm text-slate-400">{t("pay_noEmployees")}</p></Modal>;
  }

  return (
    <Modal title={t("pay_newTitle")} onClose={onClose} wide>
      <form className="space-y-4" onSubmit={submit}>
        <Field label={t("pay_month")}><input type="month" className={inputCls} value={month} onChange={e => setMonth(e.target.value)} /></Field>
        <div className="space-y-2">
          <div className="grid grid-cols-[1.3fr_1fr_1fr_1fr_1fr] gap-2 text-xs text-slate-500 px-1">
            <span>{t("common_name")}</span><span>{t("pay_base")}</span><span>{t("pay_bonus")}</span><span>{t("pay_deduction")}</span><span>{t("pay_net")}</span>
          </div>
          {items.map((it, i) => {
            const emp = employees.find(e => e.id === it.employeeId);

function IncomeStatement({ data, currency, company }) {
  const t = useT(); const { lang } = useLang();
  const accName = a => lang === "en" ? (a.nameEn || a.name) : a.name;
  const revenue = data.accounts.filter(a => a.type === "revenue");
  const expense = data.accounts.filter(a => a.type === "expense");
  const revTotal = revenue.reduce((s, a) => s + a.balance, 0);
  const expTotal = expense.reduce((s, a) => s + a.balance, 0);
  const net = revTotal - expTotal;
  return (
    <ReportShell title={t("rep_income")} company={company} currency={currency} onPrint={() => window.print()}>
      <table className="w-full text-sm">
        <thead><tr className="text-slate-500 text-xs border-b border-white/10"><th className="text-right py-2">{t("common_description")}</th><th className="text-left py-2">{t("common_total")} ({currency})</th></tr></thead>
        <tbody>
          <tr><td colSpan={2} className="pt-4 pb-1 font-black text-emerald-300">{t("inc_revenue")}</td></tr>
          {revenue.map(a => <tr key={a.id} className="border-b border-white/5"><td className="py-2 text-slate-300">{accName(a)}</td><td className="py-2 text-left tabular">{fmt(a.balance)}</td></tr>)}
          <tr className="font-bold"><td className="py-2">{t("inc_totalRevenue")}</td><td className="py-2 text-left tabular text-emerald-300">{fmt(revTotal)}</td></tr>
          <tr><td colSpan={2} className="pt-6 pb-1 font-black text-amber-300">{t("inc_expense")}</td></tr>
          {expense.map(a => <tr key={a.id} className="border-b border-white/5"><td className="py-2 text-slate-300">{accName(a)}</td><td className="py-2 text-left tabular">{fmt(a.balance)}</td></tr>)}
          <tr className="font-bold"><td className="py-2">{t("inc_totalExpense")}</td><td className="py-2 text-left tabular text-amber-300">{fmt(expTotal)}</td></tr>
        </tbody>
      </table>
      <div className={`mt-6 rounded-lg px-4 py-3 flex justify-between items-center font-black ${net >= 0 ? "bg-emerald-400/10 text-emerald-300" : "bg-rose-400/10 text-rose-300"}`}>
        <span>{net >= 0 ? t("inc_netProfit") : t("inc_netLoss")}</span><span className="tabular">{fmt(Math.abs(net))} {currency}</span>
      </div>
    </ReportShell>
  );
}

function BalanceSheet({ data, currency, company }) {
  const t = useT(); const { lang } = useLang();
  const accName = a => lang === "en" ? (a.nameEn || a.name) : a.name;
  const assets = data.accounts.filter(a => a.type === "asset");
  const liabilities = data.accounts.filter(a => a.type === "liability");
  const equity = data.accounts.filter(a => a.type === "equity");
  const revenue = data.accounts.filter(a => a.type === "revenue").reduce((s, a) => s + a.balance, 0);
  const expense = data.accounts.filter(a => a.type === "expense").reduce((s, a) => s + a.balance, 0);
  const netProfit = revenue - expense;
  const assetsTotal = assets.reduce((s, a) => s + a.balance, 0);
  const liabTotal = liabilities.reduce((s, a) => s + a.balance, 0);
  const equityTotal = equity.reduce((s, a) => s + a.balance, 0) + netProfit;
  const rightSide = liabTotal + equityTotal;
  const balanced = Math.abs(assetsTotal - rightSide) < 1;
  return (
    <ReportShell title={t("rep_balance")} company={company} currency={currency} onPrint={() => window.print()}>
      <div className="grid md:grid-cols-2 gap-6">
        <div>
          <div className="font-black text-cyan-300 mb-2">{t("bs_assets")}</div>
          <table className="w-full text-sm"><tbody>
            {assets.map(a => <tr key={a.id} className="border-b border-white/5"><td className="py-2 text-slate-300">{accName(a)}</td><td className="py-2 text-left tabular">{fmt(a.balance)}</td></tr>)}
            <tr className="font-bold"><td className="py-2">{t("bs_totalAssets")}</td><td className="py-2 text-left tabular text-cyan-300">{fmt(assetsTotal)}</td></tr>
          </tbody></table>
        </div>
        <div>
          <div className="font-black text-rose-300 mb-2">{t("bs_liabilities")}</div>
          <table className="w-full text-sm"><tbody>
            {liabilities.map(a => <tr key={a.id} className="border-b border-white/5"><td className="py-2 text-slate-300">{accName(a)}</td><td className="py-2 text-left tabular">{fmt(a.balance)}</td></tr>)}
            <tr className="font-bold"><td className="py-2">{t("bs_totalLiabilities")}</td><td className="py-2 text-left tabular text-rose-300">{fmt(liabTotal)}</td></tr>
          </tbody></table>
          <div className="font-black text-violet-300 mb-2 mt-6">{t("bs_equity")}</div>
          <table className="w-full text-sm"><tbody>
            {equity.map(a => <tr key={a.id} className="border-b border-white/5"><td className="py-2 text-slate-300">{accName(a)}</td><td className="py-2 text-left tabular">{fmt(a.balance)}</td></tr>)}
            <tr className="border-b border-white/5"><td className="py-2 text-slate-300">{t("bs_currentProfit")}</td><td className="py-2 text-left tabular">{fmt(netProfit)}</td></tr>
            <tr className="font-bold"><td className="py-2">{t("bs_totalEquity")}</td><td className="py-2 text-left tabular text-violet-300">{fmt(equityTotal)}</td></tr>
          </tbody></table>
        </div>
      </div>
      <div className={`mt-6 rounded-lg px-4 py-3 flex justify-between items-center font-black ${balanced ? "bg-emerald-400/10 text-emerald-300" : "bg-amber-400/10 text-amber-300"}`}>
        <span>{fmt(assetsTotal)} {balanced ? "=" : "≠"} {fmt(rightSide)}</span><span>{balanced ? t("bs_balancedOk") : t("bs_balancedNo")}</span>
      </div>
    </ReportShell>
  );
}

function TrialBalance({ data, currency, company }) {
  const t = useT(); const { lang } = useLang();
  const accName = a => lang === "en" ? (a.nameEn || a.name) : a.name;
  const rows = data.accounts.filter(a => a.type !== "root");
  let debitTotal = 0, creditTotal = 0;
  const lines = rows.map(a => {
    const n = nature(a.type); let debit = 0, credit = 0;
    if (n === "debit") { if (a.balance >= 0) debit = a.balance; else credit = -a.balance; }
    else { if (a.balance >= 0) credit = a.balance; else debit = -a.balance; }
    debitTotal += debit; creditTotal += credit;
    return { ...a, debit, credit };
  });
  const balanced = Math.abs(debitTotal - creditTotal) < 1;
  return (
    <ReportShell title={t("rep_trial")} company={company} currency={currency} onPrint={() => window.print()}>
      <table className="w-full text-sm">
        <thead><tr className="text-slate-500 text-xs border-b border-white/10"><th className="text-right py-2">{t("tb_account")}</th><th className="text-right py-2">{t("tb_type")}</th><th className="text-left py-2">{t("tx_debit")}</th><th className="text-left py-2">{t("tx_credit")}</th></tr></thead>
        <tbody>
          {lines.map(a => (
            <tr key={a.id} className="border-b border-white/5">
              <td className="py-2 text-slate-300">{a.code} · {accName(a)}</td>
              <td className="py-2 text-slate-500 text-xs">{TYPE_LABEL[a.type][lang === "en" ? 1 : 0]}</td>
              <td className="py-2 text-left tabular">{a.debit ? fmt(a.debit) : "—"}</td>
              <td className="py-2 text-left tabular">{a.credit ? fmt(a.credit) : "—"}</td>
            </tr>
          ))}
          <tr className="font-black"><td className="py-3">{t("tb_total")}</td><td></td><td className="py-3 text-left tabular text-cyan-300">{fmt(debitTotal)}</td><td className="py-3 text-left tabular text-cyan-300">{fmt(creditTotal)}</td></tr>
        </tbody>
      </table>
      <div className={`mt-6 rounded-lg px-4 py-3 text-center font-black ${balanced ? "bg-emerald-400/10 text-emerald-300" : "bg-amber-400/10 text-amber-300"}`}>{balanced ? t("tb_balanced") : t("tb_unbalanced")}</div>
    </ReportShell>
  );
}

function JournalLedger({ journal, currency, company }) {
  const t = useT();
  return (
    <ReportShell title={t("rep_journal")} company={company} currency={currency} onPrint={() => window.print()}>
      <div className="space-y-4">
        {journal.map(row => (
          <div key={row.id} className="border-b border-white/5 pb-4 last:border-0">
            <div className="flex items-center justify-between text-sm mb-1.5"><span className="font-bold text-slate-200">{row.memo}</span><span className="text-slate-500 tabular">{row.date}</span></div>
            <table className="w-full text-xs"><tbody>
              {row.lines.map((l, i) => (
                <tr key={i}>
                  <td className="py-1 text-slate-400 w-1/2">{l.accountName}</td>
                  <td className="py-1 text-left tabular w-1/4">{l.debit ? fmt(l.debit) + " " + t("tx_debit") : ""}</td>
                  <td className="py-1 text-left tabular w-1/4">{l.credit ? fmt(l.credit) + " " + t("tx_credit") : ""}</td>
                </tr>
              ))}
            </tbody></table>
          </div>
        ))}
        {journal.length === 0 && <div className="text-slate-600 text-sm text-center py-10">{t("journal_empty")}</div>}
      </div>
    </ReportShell>
  );
}

/* ================= settings ================= */
function SettingsPanel({ company, onSave, onResetClick }) {
  const t = useT();
  const [f, setF] = useState(company);
  const valid = f.name.trim().length > 0;
  return (
    <div className="max-w-xl">
      <div className="mb-6"><h1 className="text-2xl font-black text-slate-50 flex items-center gap-2"><span className="text-cyan-300">{Ic("building2", { size: 22 })}</span> {t("set_title")}</h1><p className="text-slate-500 text-sm mt-1">{t("set_subtitle")}</p></div>
      <form className="space-y-4 rounded-2xl border border-white/5 bg-[#111B2E] p-5" onSubmit={(e) => { e.preventDefault(); if (valid) onSave(f); }}>
        <Field label={t("auth_companyName")}><input className={inputCls} value={f.name} onChange={e => setF({ ...f, name: e.target.value })} /></Field>
        <Field label={t("set_activity")}><input className={inputCls} value={f.activity} onChange={e => setF({ ...f, activity: e.target.value })} /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label={t("common_phone")}><input className={inputCls} value={f.phone} onChange={e => setF({ ...f, phone: e.target.value })} /></Field>
          <Field label={t("set_taxId")}><input className={inputCls} value={f.taxId} onChange={e => setF({ ...f, taxId: e.target.value })} /></Field>
        </div>
        <Field label={t("set_address")}><input className={inputCls} value={f.address} onChange={e => setF({ ...f, address: e.target.value })} /></Field>
        <Field label={t("common_currency")}><input className={inputCls} value={f.currency} onChange={e => setF({ ...f, currency: e.target.value })} /></Field>
        <div className="flex justify-end pt-2"><PrimaryBtn type="submit" disabled={!valid}>{t("btn_save")}</PrimaryBtn></div>
      </form>
      <div className="mt-6 rounded-2xl border border-rose-500/20 bg-rose-500/5 p-5">
        <div className="font-bold text-rose-300 mb-1">{t("set_dangerTitle")}</div>
        <p className="text-sm text-slate-400 mb-3">{t("set_dangerBody")}</p>
        <DangerBtn onClick={onResetClick}>{Ic("trash", { size: 15 })} {t("set_resetAll")}</DangerBtn>
      </div>
    </div>
  );
}

/* ================= person / employee forms ================= */
function PersonForm({ kind, onClose, onSubmit }) {
  const t = useT();
  const [f, setF] = useState({ name: "", phone: "", email: "" });
  const valid = f.name;
  return (
    <Modal title={kind === "customer" ? t("people_newCustomer") : t("people_newSupplier")} onClose={onClose}>
      <form className="space-y-4" onSubmit={e => { e.preventDefault(); if (valid) onSubmit(f); }}>
        <Field label={t("common_name")}><input className={inputCls} value={f.name} onChange={e => setF({ ...f, name: e.target.value })} /></Field>
        <Field label={t("common_phone")}><input className={inputCls} value={f.phone} onChange={e => setF({ ...f, phone: e.target.value })} /></Field>
        <Field label={t("common_email")}><input className={inputCls} value={f.email} onChange={e => setF({ ...f, email: e.target.value })} /></Field>
        <div className="flex justify-end gap-2 pt-2"><PrimaryBtn type="submit" disabled={!valid}>{t("btn_save")}</PrimaryBtn></div>
      </form>
    </Modal>
  );
}
function EmployeeForm({ employees, onClose, onSubmit }) {
  const t = useT();
  const [f, setF] = useState({ name: "", position: "", salary: "", phone: "", hireDate: today(), department: "", managerId: "" });
  const valid = f.name && f.position && f.salary;
  return (
    <Modal title={t("emp_newTitle")} onClose={onClose}>
      <form className="space-y-4" onSubmit={e => { e.preventDefault(); if (valid) onSubmit(f); }}>
        <Field label={t("common_name")}><input className={inputCls} value={f.name} onChange={e => setF({ ...f, name: e.target.value })} /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label={t("emp_position")}><input className={inputCls} value={f.position} onChange={e => setF({ ...f, position: e.target.value })} /></Field>
          <Field label={t("emp_department")}><input className={inputCls} value={f.department} onChange={e => setF({ ...f, department: e.target.value })} /></Field>
        </div>
        <Field label={t("emp_manager")}>
          <select className={inputCls} value={f.managerId} onChange={e => setF({ ...f, managerId: e.target.value })}>
            <option value="">{t("emp_noManager")}</option>
            {employees.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
          </select>
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label={t("emp_salary")}><input type="number" min={0} className={inputCls} value={f.salary} onChange={e => setF({ ...f, salary: e.target.value })} /></Field>
          <Field label={t("emp_hireDate")}><input type="date" className={inputCls} value={f.hireDate} onChange={e => setF({ ...f, hireDate: e.target.value })} /></Field>
        </div>
        <Field label={t("common_phone")}><input className={inputCls} value={f.phone} onChange={e => setF({ ...f, phone: e.target.value })} /></Field>
        <div className="flex justify-end gap-2 pt-2"><PrimaryBtn type="submit" disabled={!valid}>{t("btn_save")}</PrimaryBtn></div>
      </form>
    </Modal>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
